[project]
name = "agentchat"
version = "0.1.0"
description = "A web app where two LLM models can chat with each other"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "ollama>=0.1.0",
    "pydantic>=2.5.0",
    "jinja2>=3.1.0",
    "aiofiles>=23.2.0",
    "aiohttp>=3.13.1",
]
